<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Kost UMKM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">
  <div class="max-w-5xl mx-auto px-4 py-6">
    <!-- Header -->
    <header class="flex justify-between items-center py-4 border-b border-gray-200 dark:border-gray-800 mb-8">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-indigo-600 dark:text-indigo-400">Kost Purnamasari</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Hunian Nyaman & Terjangkau</p>
      </div>
      <!-- Tombol Dark Mode -->
      <button id="theme-toggle" class="p-2.5 rounded-lg border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
        🌙 / ☀️
      </button>
    </header>

    <!-- Content / Grid Kost -->

    <main>
      <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4">
        <h2 class="text-xl font-bold">Daftar Kamar</h2>
        
        <!-- Tombol Filter -->

        <div class="flex flex-wrap gap-2" id="filter-container">
          <!-- Biarkan kosong, akan diisi otomatis oleh JavaScript -->
        </div>

      <div id="kost-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Rendered via JavaScript -->
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
